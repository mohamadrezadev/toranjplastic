services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toranj}
      POSTGRES_USER: ${POSTGRES_USER:-toranj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - toranj_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-toranj}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-toranj}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-session-secret}
      MEDIA_STORAGE_ROOT: /app/backend/media-uploads
      MEDIA_PUBLIC_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:-http://localhost:3001}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - backend_media:/app/backend/media-uploads

  cms:
    build:
      context: .
      dockerfile: cms/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 1337
      APP_KEYS: ${STRAPI_APP_KEYS:-toranj_strapi_app_key_1,toranj_strapi_app_key_2}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:-toranj_strapi_api_token_salt}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:-toranj_strapi_admin_jwt_secret}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:-toranj_strapi_transfer_token_salt}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${STRAPI_DATABASE_NAME:-toranj_strapi}
      DATABASE_USERNAME: ${POSTGRES_USER:-toranj}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      DATABASE_SSL: "false"
      STRAPI_REVALIDATE_SECRET: ${STRAPI_REVALIDATE_SECRET:-dev-revalidate-secret}
      FRONTEND_REVALIDATE_URL: ${FRONTEND_REVALIDATE_URL:-http://frontend:3000/api/revalidate}
    ports:
      - "127.0.0.1:${STRAPI_PORT:-1337}:1337"
    volumes:
      - strapi_uploads:/app/cms/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:1337/_health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
      - cms
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      BACKEND_API_URL: http://backend:3001/api/v1
      STRAPI_API_URL: http://cms:1337
      MEDIA_PUBLIC_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:-http://localhost:3001}
      STRAPI_MEDIA_ORIGIN: ${STRAPI_MEDIA_ORIGIN:-http://localhost:1337}
      STRAPI_REVALIDATE_SECRET: ${STRAPI_REVALIDATE_SECRET:-dev-revalidate-secret}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  toranj_postgres_data:
  backend_media:
  strapi_uploads:
